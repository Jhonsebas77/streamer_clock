name: streamer_clock
description: A Clock made in Flutter to use in Streams.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7
  flutter:
    sdk: flutter
  home_widget: ^0.7.0
  intl: ^0.20.2
  workmanager: ^0.9.0

dev_dependencies:
  dart_code_metrics: ^5.7.6
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/languages/
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
